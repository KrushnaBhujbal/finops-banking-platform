serviceName: generic-service
serviceDomain: platform
environment: dev

image:
  repository: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/generic-service
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Simulated behavior - tune per service to create realistic SLI variation
errorRate: "0.02"
minLatencyMs: "20"
maxLatencyMs: "180"

# Logging sidecar (Filebeat) - ships stdout JSON logs to ELK
sidecar:
  enabled: true
  image: docker.elastic.co/beats/filebeat:8.14.0

ingress:
  enabled: false

serviceMonitor:
  enabled: true
  interval: 15s

livenessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5
