apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceName }}
  labels:
    app: {{ .Values.serviceName }}
    domain: {{ .Values.serviceDomain }}
spec:
  selector:
    app: {{ .Values.serviceName }}
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      name: http
