# 3-node kind cluster simulating the "on-prem" leg of the hybrid architecture.
# 1 control-plane + 2 workers - enough to see real pod scheduling/distribution,
# unlike a single-node cluster where everything trivially lands in one place.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: finops-onprem

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Maps host ports to the control-plane node so services (ArgoCD UI,
      # Grafana, an ingress controller, etc.) are reachable at localhost
      # later without extra port-forwarding gymnastics.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  - role: worker
  - role: worker
